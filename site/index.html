<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio de Reservas · Laboratorio de Infraestructura Tecnológica</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #0f1e3d;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: #1f2937;
    }
    .marco {
      width: 100%;
      max-width: 640px;
      background: #14264a;
      border-radius: 18px;
      padding: 28px 20px 18px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
    }
    .marco h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      color: #ffffff;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .marco .subtitulo {
      margin: 0 0 20px;
      font-size: clamp(.85rem, 2.4vw, .98rem);
      color: #b9c7e6;
    }
    .tarjeta {
      background: #ffffff;
      border-radius: 14px;
      padding: 26px 20px 22px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .12);
    }
    .version {
      display: inline-block;
      background: #e8f7ee;
      color: #157347;
      border: 1px solid #bfe6cf;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
    }
    .tarjeta h2 {
      margin: 14px 0 8px;
      font-size: clamp(1.15rem, 3.4vw, 1.45rem);
      color: #14264a;
      font-weight: 700;
    }
    .autoria {
      margin: 0 0 22px;
      font-size: clamp(.85rem, 2.4vw, .95rem);
      color: #5b667a;
    }
    .autoria strong { color: #253453; }
    button#reservar {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px 18px;
      background: #2563eb;
      color: #ffffff;
      font-size: clamp(.95rem, 2.8vw, 1.05rem);
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, transform .08s ease;
    }
    button#reservar:hover { background: #1d4ed8; }
    button#reservar:active { transform: translateY(1px); }
    button#reservar:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    #mensaje {
      min-height: 26px;
      margin: 16px 0 0;
      font-size: clamp(.95rem, 2.6vw, 1.05rem);
      font-weight: 700;
      color: #157347;
    }
    .pie {
      margin: 16px 0 0;
      font-size: .8rem;
      color: #9fb0d0;
    }
    @media (max-width: 480px) {
      .marco { padding: 22px 14px 14px; border-radius: 14px; }
      .tarjeta { padding: 20px 14px 18px; }
    }
  </style>
</head>
<body>
  <div class="marco">
    <h1>Servicio de Reservas</h1>
    <p class="subtitulo">Laboratorio de Infraestructura Tecnológica</p>

    <main class="tarjeta">
      <span class="version">Versión 3</span>
      <h2>Sistema de reservas</h2>
      <p class="autoria">Desarrollado por <strong>Katherinne Espina</strong> y <strong>Carolina Bórquez</strong></p>
      <button id="reservar" type="button">Reservar</button>
      <p id="mensaje" role="status" aria-live="polite"></p>
    </main>

    <p class="pie">Proyecto académico · Ciclo de Vida del Software I</p>
  </div>

  <script>
    document.getElementById('reservar').addEventListener('click', function () {
      document.getElementById('mensaje').textContent = '✓ Reserva confirmada';
    });
  </script>
</body>
</html>
